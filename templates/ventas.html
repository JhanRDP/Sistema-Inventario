<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-warning">📊 Historial General de Ventas</h2>
            <div>
                <a href="/" class="btn btn-primary me-2">🛒 Ir al POS</a>
                <a href="/inventario" class="btn btn-secondary me-2">📦 Inventario</a>
                <a href="/logout" class="btn btn-outline-danger">Salir</a>
            </div>
        </div>

        <div class="card border-secondary p-3">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID Venta</th>
                        <th>Cajero / Usuario</th>
                        <th>Total Cobrado</th>
                        <th>Fecha y Hora</th>
                    </tr>
                </thead>
                <tbody>
                    {% for v in ventas %}
                    <tr>
                        <td><code>#{{ v.id }}</code></td>
                        <td>{{ v.usuario }}</td>
                        <td class="fw-bold text-success">S/ {{ "%.2f"|format(v.total) }}</td>
                        <td>{{ v.fecha_venta }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
